name: release

# Publishes a DMG whenever a v* tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests
        run: Scripts/test.sh

      - name: Build and package
        run: Scripts/package.sh

      - name: Check the tag matches the bundle version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match CFBundleShortVersionString $VERSION" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            sed -e "s|@TAG@|$TAG|g" .github/release-notes.md
            echo
            echo '### Checksum'
            echo
            echo '```'
            shasum -a 256 build/*.dmg | sed 's|build/||'
            echo '```'
          } > notes.md

          gh release create "$TAG" build/*.dmg \
            --title "Claude Usage ${TAG#v}" \
            --notes-file notes.md \
            --verify-tag
