name: release

# Publishes one release per version, with the downloads for every platform, whenever
# a v* tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Every platform's version must match the tag, or the files would be misnamed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches every version
        run: |
          macos="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' macos/Resources/Info.plist)"
          linux="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' linux/claude_usage/__init__.py)"
          echo "tag=$TAG macos=$macos linux=$linux"
          [ "$TAG" = "v$macos" ] || { echo "tag $TAG does not match the macOS version $macos" >&2; exit 1; }
          [ "$TAG" = "v$linux" ] || { echo "tag $TAG does not match the Linux version $linux" >&2; exit 1; }
          grep -q "^## \[$macos\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $macos" >&2; exit 1; }

  macos:
    needs: verify
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Run tests
        run: Scripts/test.sh

      - name: Build and package
        run: Scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/build/*.dmg
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 gir1.2-secret-1 xvfb dbus

      - name: Run tests
        run: xvfb-run -a dbus-run-session -- make test

      - name: Build packages
        run: |
          make deb
          make dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            linux/dist/*.deb
            linux/dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          (cd artifacts && sha256sum * > SHA256SUMS)
          python3 scripts/release-notes.py "$TAG" artifacts/SHA256SUMS > notes.md

          gh release create "$TAG" artifacts/* \
            --title "Claude Usage ${TAG#v}" \
            --notes-file notes.md \
            --verify-tag
